name: CI/CD — Build & Deploy nuurkey.dev

on:
  push:
    branches:
      - main
      - master

jobs:
  # JOB 1: CONTINUOUS INTEGRATION (Verify React Build & Dockerfile)
  ci-build-check:
    name: 1. Test Build & Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Verify production Vite build passes
        run: npm run build

      - name: Verify Docker image builds cleanly
        run: docker build -t nuurkey-web-test .

  # JOB 2: CONTINUOUS DEPLOYMENT (Auto-update VPS only if Job 1 passes!)
  cd-deploy-vps:
    name: 2. Auto-Deploy to Linux VPS
    needs: ci-build-check
    runs-on: ubuntu-latest
    # Only runs if VPS_HOST secret is configured in GitHub Repo Settings
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: SSH into VPS and rebuild container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nuurkey.dev
            git pull
            docker compose up -d --build
